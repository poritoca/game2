<script id="engine">

// Test contact before either actor advances AND after advancement: entering an
// occupied cell and crossing a projectile cannot disappear between ticks.
// Enemies may enter the hero tile. Contact is lethal for a human player;
// certified auto-runs and demonstration playback use a visible emergency defense
// when movement would otherwise cause an unavoidable collision. This works even
// if the currently equipped weapon cannot reach the target or has no ammo.
function autoContactGuard(enemy=null,shot=null){
 if(!enemy&&!shot)return false;
 const now=performance.now(),q=pos;
 const palette={outline:'#34516d',shadow:'#6688a2',body:'#a9ecff',core:'#fffde3'};
 blastFX.push({p:q,at:now,r:1,color:'#baf5ff',palette,effect:'megablast'});
 if(blastFX.length>32)blastFX.shift();
 sparks.push({p:q,life:18,color:'#c7faff'});
 if(enemy&&entities.includes(enemy)){
   damageWeaponEnemy(enemy,Math.max(enemy.hp??enemyHP(enemy.type),enemyHP(enemy.type)),{palette,effect:'megablast'});
 }
 if(shot){const i=shots.indexOf(shot);if(i>=0)shots.splice(i,1);}
 beep(750,.05,'triangle');
 return true;
}
function worldCollision(){
 if(!['playing','route'].includes(mode))return false;
 const assisted=mode==='route'||(mode==='playing'&&!!autoRun);
 const enemy=entities.find(e=>e.p===pos);
 if(enemy){
   if(assisted){autoContactGuard(enemy,null);}
   else{die(enemyNames[enemy.type]+'にぶつかった');return true;}
 }
 const shot=shots.find(s=>s.p!==null&&s.p===pos);
 if(shot){
   if(assisted){autoContactGuard(null,shot);}
   else{die((enemyNames[shot.kind]||'敵')+'の飛び道具に当たった');return true;}
 }

// Frostbound original defeat effect: twelve ice-energy motes burst radially like a retro action game.
// It uses original pixel shapes (no sprites/assets/audio sampled from other games).
const DEATH_FX_MS=1250;
function drawDeathBurst(now,cx,cy){
  const age=Math.max(0,now-deathAt);
  const over=age>=DEATH_FX_MS;
  ctx.save();
  ctx.imageSmoothingEnabled=false;
  // A short silhouette remains at the impact moment. No repeated hard flashes.
  if(age<145){
    const a=1-age/145;
    ctx.globalAlpha=a;
    if(age<95){character(cx-12,cy-12,deathAt,false);}
    const bloom=5+age*.11;
    ctx.globalCompositeOperation='screen';
    const gradient=ctx.createRadialGradient(cx,cy,0,cx,cy,bloom);
    gradient.addColorStop(0,'rgba(255,255,255,.95)');
    gradient.addColorStop(.45,'rgba(178,240,255,.55)');
    gradient.addColorStop(1,'rgba(105,202,244,0)');
    ctx.fillStyle=gradient;ctx.beginPath();ctx.arc(cx,cy,bloom,0,Math.PI*2);ctx.fill();
  }
  // Expanding icy shock ring, drawn as stepped pixels to match the game's 24px tile art.
  if(age<480){
    const wave=Math.min(1,age/480),rad=4+wave*36;
    ctx.globalCompositeOperation='screen';ctx.globalAlpha=.68*(1-wave);
    ctx.strokeStyle='#87defa';ctx.lineWidth=wave<.46?3:2;
    ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='#fff7e6';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(cx,cy,rad-3,0,Math.PI*2);ctx.stroke();
  }
  // Twelve crisp glowing orbs radiate outward. Each has a faint trailing echo and 3-tone core.
  if(age>=105&&!over){
    const travel=Math.min(1,(age-105)/920),eased=1-Math.pow(1-travel,1.17);
    const fade=Math.min(1,(DEATH_FX_MS-age)/340);
    for(let j=0;j<12;j++){
      const angle=-Math.PI/2+j*Math.PI/6, speed=(j%3===0?1.10:j%3===1?.98:1.06);
      const vx=Math.cos(angle),vy=Math.sin(angle),r=(6+83*eased)*speed;
      const bx=cx+vx*r,by=cy+vy*r;
      ctx.globalCompositeOperation='screen';
      for(let k=2;k>=1;k--){
        const trailR=r-k*(10+4*travel),tx=cx+vx*trailR,ty=cy+vy*trailR;
        ctx.globalAlpha=(.18+(2-k)*.10)*fade;
        rect(tx-2,ty-2,5,5,'#77c5ed');
      }
      ctx.globalAlpha=Math.max(0,fade)*(j%2?.93:1);
      ctx.globalCompositeOperation='source-over';
      const bounce=age<290?1.12:age>910?.75:1;
      const sz=(j%3===0?11:9)*bounce;
      // Chunky original pixel circle with alternating pale-blue edge pixels.
      rect(bx-sz/2-2,by-sz/2-1,sz+4,sz+2,'#123855');
      rect(bx-sz/2-1,by-sz/2-2,sz+2,sz+4,'#123855');
      rect(bx-sz/2,by-sz/2,sz,sz,'#6cc5f3');
      rect(bx-sz/2+1,by-sz/2-1,sz-2,sz+2,'#c5f1ff');
      rect(bx-sz/2+2,by-sz/2+1,Math.max(2,sz-4),Math.max(2,sz-3),'#fffef2');
      // 4-point flickering sparkle, but only a gentle glint (no full-screen strobe).
      if((Math.floor(age/115)+j)%3===0){
        ctx.globalAlpha=.7*fade;
        rect(bx-1,by-sz/2-4,2,3,'#e8ffff');
        rect(bx-1,by+sz/2+1,2,3,'#d4f6ff');
        rect(bx-sz/2-4,by-1,3,2,'#d4f6ff');
        rect(bx+sz/2+1,by-1,3,2,'#e8ffff');
      }
    }
  }
  // After the energy spheres disperse, leave an unmistakable short MISS indicator.
  if(age>720){
    const a=Math.min(1,(age-720)/160);
    ctx.globalAlpha=a;ctx.globalCompositeOperation='source-over';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 16px monospace';
    rect(cx-29,cy-34,58,22,'#18334d');
    rect(cx-26,cy-31,52,2,'#7fbed7');
    ctx.fillStyle='#0b1929';ctx.fillText('MISS!',cx+1,cy-21);
    ctx.fillStyle='#fff9e5';ctx.fillText('MISS!',cx,cy-22);
  }
  ctx.restore();
}

function asyncBoardProof(state,callback){

 // Existing dedicated checker keeps the expensive solver off the animation thread.
 if(checkWorker){checkWorker.onmessage=e=>{if(e.data.token===token)finish(e.data.path,!!e.data.limited);};checkWorker.onerror=()=>{checkWorker.terminate();checkWorker=null;finish(null,true);};try{checkWorker.postMessage({type:'check',token,board:rawBoard(board),state});}catch(_){finish(null,true);}}

function trackManualLoop(){

 ['pit','通れない穴','黒い穴は絶対に渡れません。岩を穴へ押し込んで足場にすると、初めて上を通れます。デモでも穴の上を歩き抜けません。'],
 ['boulder','岩を押す','岩は押せますが引けません。岩の手前で止まってからもう一度同じ方向で押すことがあります。押す先に壁や岩がある場合は移動できません。'],
 ['switch','床スイッチ','スイッチを踏むたび A の壁と B の壁の開閉が交代します。通れる状態と止まる位置が変わります。'],
 ['wait','待機とタイミング','何も押さなければ待機できます。罠は24拍周期で変化するため、赤い危険マスが消えるタイミングを狙いましょう。'],
 ['ice','方向キー・スワイプ','方向キー・矢印キー・WASD・盤面のスワイプで操作できます。氷では滑走し、地面では1マス歩きます。'],
 ['ice','タップで強めの追従ズーム','盤面をタップすると約7×8マスを見渡せる強めの拡大。再タップで全体表示へ戻ります。カメラは主人公をなめらかに追い、盤面のスワイプは従来どおり移動です。長押しでは敵を狙えます。'],
 ['ice','2本指で自由に倍率変更','盤面上で2本の指を広げるピンチアウトは拡大、つまむピンチインは縮小です。1.0～5.0倍の間で細かく調整でき、指を離してもその倍率を維持。1回タップすると全体表示に戻ります。ピンチは移動として扱われません。'],
 ['ground','最短手数の数え方','氷で1回滑ると通常1手。地面の歩行は0手ですが岩を1マス押すと1手です。待機は0手。クリア画面には今回と最短を表示します。'],
 ['ice','詰み防止と巻き戻し','方向入力でクリア不可能になる場合は操作を防ぎます。巻き戻しは元の盤面に戻せますが評価手数にはペナルティがあります。'],
 ['ice','解答の確認','「ここからの解答」で最短経路を確認できます。時間制限ありのメインでは道しるべを消費しておまかせ移動もできます。'],
 ['goal','クリアと記録','面クリアは最短手数を中心にシンプル表示。名前つき記録は時間切れ・冒険失敗・自滅など終了したときにまとめて保存します。'],
 ['ice','武器とレアリティ','COMMONは弱い敵を1〜2回、RAREは中型の敵を1〜2回で倒す目安です。EPIC・LEGENDは硬い敵に強くなります。範囲・発射速度・固有効果も確認しましょう。'],
 ['ice','拾った武器の弾数','宝箱から得た武器にはランダムな弾数がつきます。敵が多い面は弾数を少し多めに抽選。攻撃が外れても1発消費します。最後の1発を撃つと、無制限に撃てる標準銃へ自動で切り替わるので攻撃不能にはなりません。'],
 ['ice','時限爆発する銃','「時限・」とついた銃は、弾が敵や障害物に当たると爆弾を設置し、約0.6秒後に周囲をまとめて爆破します。弾数制ですが、爆風は複数の敵・罠に有効です。自動攻略では爆発までその場で待ちます。'],
 ['ice','武器の射程・狙い','タップで自動照準、攻撃ボタンを上下左右へフリックして方向を指定できます。武器を選ぶ時は色つき範囲と威力を見比べましょう。'],
 ['ice','星の爆弾と道具','星の爆弾は周囲5マスの敵・敵弾・罠を一掃します。対象がいなければ消費しません。砂時計・岩や床の道具は道具袋から使えます。'],
 ['ground','同行キャラの役割','護衛は敵への攻撃、氷解の精霊は罠解除、守灯の精霊は敵弾消去、月影の使い魔は攻撃と罠解除。主人公のそばへ素早く追従します。'],
 ['wall','敵と危険なマス','敵そのものや飛び道具、作動中の罠に当たると失敗です。赤い予告を見て移動・待機を選びます。'],
 ['goal','最短ルートの鑑賞','「眺める」では実際の生成ステージとその最短ルートをアニメで再生します。練習や編集もできます。']
];
function manualEntries(){let basics=MANUAL_CORE.map(([type,name,text])=>({kind:'floor',type,name,text,group:'基本'}));let floors=Object.entries(TERRAIN).filter(([type])=>!['ground','pit'].includes(type)).map(([type,name])=>({kind:'floor',type,name,text:type==='brake'?'踏むと必ず停止する床。次の1手で向きを選べます。':type==='switch'?'踏むとA/Bの壁が反転します。':type==='gateA'||type==='gateB'?'開閉状態の合うときだけ通り抜けられます。閉じたら手前で止まります。':'矢印・線で示した方向からだけ入れます。逆方向からの侵入はできません。',group:'床と岩'}));let hazards=[...['spike','pendulum','fire','rock'].map(type=>({kind:'hazard',type,name:{spike:'棘床',pendulum:'振り子の鉄球',fire:'火球装置',rock:'往復する岩'}[type],text:'危険な赤マスを避けましょう。緑で休止中のときは触れると装置を壊せます。',group:'罠・ギミック'})),...Object.entries(EXTRA_HAZARDS).map(([type,data])=>({kind:'hazard',type,name:data[0],text:data[3]+'。赤い範囲は危険、緑の休止中は破壊可能です。',group:'罠・ギミック'}))];let monsters=Object.entries(enemyNames).map(([type,name])=>({kind:'enemy',type,name,text:enemyDescription(type)+'。敵の接触や飛び道具に注意。武器でHPを削って倒せます。',hp:enemyHP(type),group:'モンスター'}));return [...basics,...floors,...hazards,...monsters];}
function openManual(fromTitle=false){let entries=manualEntries(),savedLeft=pausedLeft;mode='manual';guide={entries,page:0,at:performance.now(),last:-1,preview:null,manual:true};function exit(){guide=null;closeModal();if(fromTitle){showTitle('other');}else{mode='playing';tickAt=performance.now();deadline=tickAt+savedLeft;}}function show(){if(!guide||mode!=='manual')return;let e=entries[guide.page];guide.preview=guideBoard(e);guide.at=performance.now();guide.last=-1;let kinds=['基本','床と岩','罠・ギミック','モンスター'];modal('<div class="guideTop"><span>動くフィールド図鑑</span><span>'+(guide.page+1)+' / '+entries.length+'</span></div><div class="manualCategory">'+kinds.map(k=>'<button data-group="'+k+'" class="'+(e.group===k?'gold':'flat')+'">'+k+'</button>').join('')+'</div><h2 class="guideName">'+esc(e.name)+(e.hp?' <small>HP '+e.hp+'</small>':'')+'</h2><canvas id="guideCanvas" width="216" height="168" aria-label="'+esc(e.name)+'の動作見本"></canvas><div id="guideState" class="guideState"></div><p class="guideText">'+esc(e.text)+'</p><div class="row"><button id="manualPrev" '+(guide.page===0?'disabled':'')+'>◀ 前へ</button><button class="primary" id="manualNext">'+(guide.page===entries.length-1?'最初へ':'次へ ▶')+'</button></div><p class="manualBottom">ページを選ぶと実際の床・モンスター・罠が動きます</p><button id="manualExit" class="flat guideSkip">図鑑を閉じる</button>');document.querySelectorAll('#modal [data-group]').forEach(b=>b.onclick=()=>{guide.page=entries.findIndex(x=>x.group===b.dataset.group);show();});$('manualPrev').onclick=()=>{guide.page--;show();};$('manualNext').onclick=()=>{guide.page=(guide.page+1)%entries.length;show();};$('guideCanvas').onclick=()=>$('manualNext')?.click();$('guideCanvas').title='画像をタップすると次の解説へ';$('manualExit').onclick=exit;drawGuide(performance.now());}show();}

function guideEntries(){let list=[];for(let k of new Set(board.hazards.map(h=>h.type)))list.push({kind:'hazard',type:k,name:EXTRA_HAZARDS[k]?.[0]||{spike:'棘',pendulum:'振り子',fire:'火球装置',rock:'動く岩'}[k],text:(EXTRA_HAZARDS[k]?.[3]||{spike:'周期的に棘が飛び出す。',pendulum:'鉄球が左右に振れる。',fire:'発射口から火球が流れる。',rock:'岩が3マスを往復する。'}[k])+' 緑の休止中に触れると破壊。'});for(let k of new Set((board.terrain||[]).map(f=>f.type)))list.push({kind:'floor',type:k,name:TERRAIN[k],text:k==='ground'?'1マスずつ歩く。歩行は0手、岩を1マス押すと1手。氷へ踏み出す位置を選ぼう。':k==='pit'?'そのままでは通れない穴。岩を押し込むと足場になる。':['switch','gateA','gateB'].includes(k)?'スイッチを通るたび A と B の壁が反転。閉じた壁の手前で止まる。上にいる壁が閉じても、そこから出られます。':k==='brake'?'ここで滑走が止まる。次の方向を選ぼう。':'矢印・レールの向きに合う方向からだけ入れる。'});if(rockStarts(board).length)list.push({kind:'floor',type:'boulder',name:'押せる岩',text:(board.strengthRoom?'岩は1マスずつ押せる。引くことはできません。押す順番と回り込む場所を考え、結晶までの通路を開こう。':'滑って岩に当たると停止。もう一度その方向を押すと1マス押せる。穴へ落とすと足場になる。足場の上では止まれます。')+(board.requiredFill?' この面は穴2つを埋めるとゴールへ入れます。':'')});if(board.frag.length)list.push({kind:'floor',type:'frag',name:'薄氷',text:'一度通ると穴になる。離れた後は戻れない。'});for(let k of new Set(entities.map(e=>e.type)))list.push({kind:'enemy',type:k,name:enemyNames[k],text:enemyDescription(k)+'。接触は危険。武器の範囲内で攻撃しよう。',hp:enemyHP(k)});return list;}

// Enemy bullets get a real-time clock of their own. The route's moving character,
// its pause-for-bombs mechanic, and the replay speed must never freeze enemy shots.
function tickRouteShots(t){
 if(mode!=='route'||!routeAuto){routeShotAt=t;return;}
 if(!routeShotAt)routeShotAt=t;
 let elapsed=Math.max(0,t-routeShotAt),steps=Math.min(10,Math.floor(elapsed/(BEAT*2)));
 for(let i=0;i<steps;i++){
  routeShotAt+=BEAT*2;
  for(let s of shots){s.from=s.p;s.index++;s.p=s.path?.[s.index]??null;s.at=t;}
  shots=shots.filter(s=>s.p!==null&&s.index<(s.path?.length||0));
  if(worldCollision())return;
 }
 if(elapsed>BEAT*20)routeShotAt=t;
}

function editorImage(){let saved={board,ctx,entities,shots,sparks,drawBroken,pos,mask};try{let c=document.createElement('canvas');c.width=editorDraft.w*24;c.height=editorDraft.h*24;ctx=c.getContext('2d');board=prepare(clone(editorDraft));pos=board.start;mask=0;drawBroken=0;entities=board.monsters.map((e,i)=>({...e,id:'preview'+i,from:e.p,at:-1000}));shots=[];sparks=[];for(let q=0;q<board.cells.length;q++)tile(q,0,pos,0);drawBoulder(0);drawHazards(Number($('editPhase').value||0)*2,0);drawWorld(0);character(pos%board.w*24,(pos/board.w|0)*24,0,false);return c.toDataURL();}finally{board=saved.board;ctx=saved.ctx;entities=saved.entities;shots=saved.shots;sparks=saved.sparks;drawBroken=saved.drawBroken;pos=saved.pos;mask=saved.mask;}}
function paintEditor(){try{localStorage.setItem('frostbound.draft',JSON.stringify(editorDraft));}catch(e){}let b=editorDraft,g=$('editorGrid'),picture=editorImage();g.style.gridTemplateColumns='repeat('+b.w+',24px)';g.innerHTML='';for(let q=0;q<b.cells.length;q++){let btn=document.createElement('button'),haz=b.hazards.find(h=>hazardZone(h).includes(q)),enemy=b.monsters.find(e=>e.p===q);btn.textContent=q===b.start?'S':q===b.goal?'G':enemy?enemyNames[enemy.type]:haz?(EXTRA_HAZARDS[haz.type]?.[0]||{spike:'棘',pendulum:'振り子',fire:'火球',rock:'動く岩'}[haz.type]):TERRAIN[b.tm?.[q]]||TERRAIN[(b.terrain||[]).find(f=>f.p===q)?.type]||(b.frag.includes(q)?'薄氷':'');btn.setAttribute('aria-label',(q%b.w+1)+'列 '+((q/b.w|0)+1)+'行 '+(btn.textContent|| (b.cells[q]?'壁':'氷床')));btn.style.background=b.cells[q]?'#30303b':b.frag.includes(q)?'#cee8fa':'#86aebf';btn.style.backgroundImage='url('+picture+')';btn.style.backgroundPosition=(-q%b.w*24)+'px '+(-(q/b.w|0)*24)+'px';btn.style.width='24px';btn.style.height='24px';btn.style.color='transparent';btn.style.imageRendering='pixelated';btn.onclick=()=>{try{editCell(q);paintEditor();$('editorMsg').textContent='未検証：検証ボタンで確認';}catch(e){$('editorMsg').textContent=e.message;}};g.appendChild(btn);}}
function editCell(q){let b=editorDraft,t=$('brush').value;if((q===b.start||q===b.goal)&&!['start','goal','ice'].includes(t))throw Error('先に開始・ゴールを移動してください');let backup=clone(b),wasGround=(b.terrain||[]).some(f=>f.p===q&&f.type==='ground');try{b.hazards=b.hazards.filter(h=>!hazardZone(h).includes(q));b.monsters=b.monsters.filter(e=>e.p!==q);b.frag=b.frag.filter(p=>p!==q);b.terrain=(b.terrain||[]).filter(f=>f.p!==q);b.boulders=rockStarts(b).filter(p=>p!==q);delete b.boulder;b.cells[q]=t==='wall'?1:0;if(t==='start'||t==='goal')b[t]=q;else if(t==='boulder'){if(b.boulders.length>=16)throw Error('押せる岩は16個まで');b.boulders.push(q);if(wasGround)b.terrain.push({p:q,type:'ground'});}else if(t==='frag')b.frag.push(q);else if(TERRAIN[t])b.terrain.push({type:t,p:q});else if(EXTRA_HAZARDS[t]){let h=makeExtra(t,q,Number($('editDir').value),b.w,b.h,Number($('editPhase').value));if(!h)throw Error('盤面の外には配置できません');b.hazards.push(h);}else if(Object.hasOwn(enemyNames,t))b.monsters.push({type:t,p:q});else if(['spike','pendulum','fire','rock'].includes(t)){let h={type:t,offset:Number($('editPhase').value)};if(t==='spike')h.p=q;else{let d=DIRS[Number($('editDir').value)],n=t==='pendulum'?5:t==='fire'?5:3;h.path=Array.from({length:n},(_,i)=>q+i*d[0]+i*d[1]*b.w);if(t==='fire'){h.wall=q;h.path.shift();}if(t==='pendulum')h.anchor=h.path[2];}b.hazards.push(h);}validateCustom(b);}catch(e){editorDraft=backup;throw e;}}
readSave();layoutMode='auto';refreshLayout();$('layoutToggle').onclick=toggleLayoutMode;$('help').before($('hintDetails'));showTitle();showOrientationChoice();requestAnimationFrame(frame);
</script></body></html>
